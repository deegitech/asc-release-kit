[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asc-release-kit"
version = "0.1.0"
description = "App Store Connect release and metadata chores from the command line: plan first, apply on purpose, verify by reading back."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DEEGITECH" }]
keywords = [
  "app-store-connect",
  "ios",
  "release",
  "aso",
  "app-store-optimization",
  "fastlane-alternative",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Signs tokens in-process instead of calling the openssl command.
crypto = ["cryptography>=42"]
# TOML config files on Python 3.10 (3.11+ reads them with the standard library).
toml = ["tomli>=2.0; python_version < '3.11'"]
# Linters are pinned so a new release can't turn CI red without a code change;
# Dependabot proposes the updates.
dev = [
  "pytest>=8",
  "cryptography>=42",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
asc-release-kit = "asc_release_kit.cli:main"
asckit = "asc_release_kit.cli:main"

[project.urls]
Homepage = "https://github.com/deegitech/asc-release-kit"
Documentation = "https://github.com/deegitech/asc-release-kit#readme"
Issues = "https://github.com/deegitech/asc-release-kit/issues"
Changelog = "https://github.com/deegitech/asc-release-kit/blob/main/CHANGELOG.md"
Security = "https://github.com/deegitech/asc-release-kit/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_release_kit"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "scripts",
  "README.md",
  "README.tr.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["E501", "SIM108", "UP007", "UP045"]
