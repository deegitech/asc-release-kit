name: Feature request
description: Suggest a new command or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The release or metadata chore you'd like to automate.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: Commands, flags or output you have in mind. Links to Apple's API docs are welcome.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety model
      options:
        - label: The feature can follow plan-by-default, `--apply` to write, and read-back verification.
